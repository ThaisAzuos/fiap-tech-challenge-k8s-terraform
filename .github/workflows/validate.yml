name: Validate Terraform

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
      - name: Terraform Format
        run: terraform fmt -check
      # validate exige um diretório inicializado (providers e módulos baixados).
      # -backend=false pula a configuração do backend S3, que depende de segredos
      # AWS indisponíveis em PRs de fork — providers são resolvidos normalmente.
      - name: Terraform Init
        run: terraform init -backend=false
      - name: Terraform Validate
        run: terraform validate
