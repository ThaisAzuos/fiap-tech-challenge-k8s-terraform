name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - dev

env:
  AWS_REGION: us-east-1

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="key=k8s/${{ github.event.inputs.environment }}/terraform.tfstate" -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file=envs/${{ github.event.inputs.environment }}.tfvars \
            -var "newrelic_license_key=${{ secrets.NEW_RELIC_LICENSE_KEY }}" \
            -out=tfplan

      - name: Terraform Apply
        run: terraform apply tfplan

      - name: Exibir outputs (copie para GitHub Secrets)
        run: |
          echo "### Outputs do Terraform" >> $GITHUB_STEP_SUMMARY
          echo "VPC_ID: $(terraform output -raw vpc_id)" >> $GITHUB_STEP_SUMMARY
          echo "PRIVATE_SUBNET_IDS: $(terraform output -json private_subnet_ids)" >> $GITHUB_STEP_SUMMARY
          echo "EKS_CLUSTER_NAME: $(terraform output -raw eks_cluster_name)" >> $GITHUB_STEP_SUMMARY
